### v3 — Vision Tower LoRA + rank 128/alpha 256 (capacity 2배)
### 데이터·하이퍼파라미터 v2 와 동일, LoRA rank/alpha 만 증가.
### 모델
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct

### 학습 방법
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128                          # 64 → 128 (capacity 2배)
lora_alpha: 256                         # 128 → 256 (alpha/rank=2 비율 유지)
lora_dropout: 0.05
lora_target: all                        # vision tower 의 projection 도 포함

### Vision 학습 (v2 와 동일)
freeze_vision_tower: false
freeze_multi_modal_projector: false

### 데이터셋
dataset: livestock_ko
dataset_dir: C:/Users/IPC/Desktop/git/LLaMA-Factory/data
template: qwen3_vl_nothink
cutoff_len: 1024
max_samples: 30000
overwrite_cache: true
preprocessing_num_workers: 1

### 출력 (v3 별도 디렉터리, 기존 v2-corrected 보존)
output_dir: vlm/train/output/qwen3vl-lora-v3
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### 학습 하이퍼파라미터 (rank 증가로 메모리 약간 ↑ — 동일 batch 유지)
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
dataloader_num_workers: 0

### 검증
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200

### 이미지 (v2 와 동일)
image_max_pixels: 100352
video_max_pixels: 50176
