### v5 — 다양성 회복 (rank 다운 + dropout ↑, 데이터는 v4 동일)
###
### 가설:
### - v3 (rank 128) / v4 (rank 64) 모두 distinct_2 -26.9% (학습 reference 암기)
### - "권고" 필드 distinct_2: v2-corrected 0.0659 → v3/v4 0.0200 (-69.7%) — 가장 심한 암기
### - capacity 를 줄이고 dropout 을 키워 reference 의 표면 패턴 암기를 억제
###
### 핵심 변경 (v4 → v5):
### - lora_rank: 64 → 32 (capacity 절반)
### - lora_alpha: 128 → 64 (alpha/rank=2 비율 유지)
### - lora_dropout: 0.05 → 0.10 (regularization 강화)
### - 학습 데이터: livestock_train_v4.json (8,110) 그대로 — 데이터 변경 없이 hyperparam 만 변경
### - 출력 디렉터리: qwen3vl-lora-v5/ (v4 보존)
###
### 검증:
### - 학습 후 `python -m vlm.bench.harness run --models lora_v5 --force`
### - `python -m vlm.bench.harness score --check` → distinct_2 가 baseline(-10%) 안에 들어오는지
### - 합격 기준: ROUGE_L >= 0.85 (v2-corrected 0.87 근처 유지) + distinct_2 >= 0.28 (-10% 안)

### 모델
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct

### 학습 방법
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32                            # v4 64 → 32 (capacity 절반, 암기 억제)
lora_alpha: 64                           # alpha/rank=2 비율 유지
lora_dropout: 0.10                       # v4 0.05 → 0.10 (regularization ↑)
lora_target: all

### Vision 학습 (v4 와 동일)
freeze_vision_tower: false
freeze_multi_modal_projector: false

