### v7 — 전체 이미지 데이터셋 (날짜 포함 매칭) 으로 재학습
###
### v6 → v7 변경의 핵심:
### - 데이터 규모 대폭 확대: build_dataset.py 매칭 키를 (pigno_cnt, ymd) 로 수정해
###   같은 도체번호의 서로 다른 도축일 건 충돌(마지막 1건만 생존) 문제를 제거.
###   * dataset.jsonl: 3,816 → 10,852 건 (이미지 10,852장 전량 사용)
###   * livestock_train.json: 21,604 샘플 (10,802 도체 × summary+grade, 평가셋 50 held-out)
### - 데이터 파일: livestock_ko (= livestock_train.json) — round-robin paraphrase 4종 유지
### - hyperparam: v6 와 100% 동일 (rank 64 / alpha 128 / dropout 0.05, Vision 학습 on)
### - 출력 디렉터리만 v7 로 분리, v6 산출물 보존
###
### 합격 기준 (v5/v6 동일):
### - ROUGE_L >= 0.85 (v2-corrected 수준 유지)
### - distinct_2 >= 0.28
### - 데이터 3배 확대가 표현 다양성/일반화에 주는 효과 관찰

### 모델
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct

### 학습 방법
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64                            # v6 동일
lora_alpha: 128                          # alpha/rank=2
lora_dropout: 0.05                       # v6 동일
lora_target: all

### Vision 학습 (v4/v5/v6 와 동일)
freeze_vision_tower: false
freeze_multi_modal_projector: false

### 데이터셋 (v7 — 전체 10,852 이미지 기반 21,604 샘플)
dataset: livestock_ko
dataset_dir: C:/Users/IPC/Desktop/git/LLaMA-Factory/data
template: qwen3_vl_nothink
cutoff_len: 1024
max_samples: 30000
overwrite_cache: true
preprocessing_num_workers: 1

### 출력 (v7 별도 디렉터리)
output_dir: vlm/train/output/qwen3vl-lora-v7
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### 학습 하이퍼파라미터 (v6 와 동일)
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
dataloader_num_workers: 0

### 검증
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200

### 이미지
image_max_pixels: 100352
video_max_pixels: 50176
