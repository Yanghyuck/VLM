### v6 — 데이터 측 paraphrase 다양화 (v5 결과 기반 방향 전환)
###
### v5 결과 회고:
### - rank 32 + dropout 0.10 로 capacity 축소 → "권고/주의사항" 다양성은 회복 (권고 +424% vs v4)
### - 그러나 "3문장_요약" 필드는 +3.7% (변화 미미), 합격기준 distinct_2 ≥ 0.28 미달 (0.2381)
### - 결론: capacity 축소만으로는 reference 패턴 일관성을 못 깸 → 데이터 측 해결 필요
###
### v6 핵심 변경 (v4 → v6):
### - 학습 데이터: livestock_train_v4.json → livestock_train_v6.json
###   * convert_dataset.py 에 _summary_response_bullet, _summary_response_table 추가 (총 4 paraphrase)
###   * round-robin 모드로 도체 ID 결정적 분포 (id % 4)
###   * abnormal 도 기존 3 paraphrase 모두 활용 (id % 3, 기존엔 첫 번째만 사용)
### - hyperparam: rank 64, dropout 0.05 (v4 와 동일 — capacity 축소 가설 v5 에서 부분 검증 완료)
### - 학습 시간 v4 와 유사 (~6h) — 샘플 수 그대로 8,110, paraphrase 만 다양화
###
### 합격 기준 (v5 동일):
### - ROUGE_L >= 0.85 (v2-corrected 수준 유지)
### - distinct_2 >= 0.28 (baseline -10% 안)
### - 추가 관찰: 필드별 distinct_2 모두 baseline 근처 회복

### 모델
